<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal vehicle expense & maintenance tracker: fuel, expenses, services, income, routes, reminders and reports.">
  <meta name="theme-color" content="#0B97A5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MotoLog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MotoLog</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Deliberately NOT serving Cross-Origin-Opener-Policy /
    Cross-Origin-Embedder-Policy headers on the deployed site. Those would
    unlock SharedArrayBuffer, which drift (core/db/app_database.dart) could
    use for its faster OPFS web worker — but COOP/COEP also block loading
    cross-origin resources that don't opt in, which breaks the OSM map
    tiles (My places / location picker, served from tile.openstreetmap.org)
    and the Google OAuth sign-in popup; Safari also doesn't support the
    `credentialless` COEP mode that would otherwise let those through.
    drift falls back to its IndexedDB (sharedIndexedDb) worker instead,
    which works everywhere without extra server config. Revisit if drift
    adds an OPFS mode that tolerates `credentialless`, or if the map/OAuth
    dependencies change.
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
