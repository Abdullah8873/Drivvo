# Continuous Delivery: on every push to main (i.e. a merged release PR from
# develop) or a version tag, build release artifacts and publish them.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# The Android job is skipped automatically until the keystore secret exists.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  android:
    name: Signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: env.HAS_KEYSTORE == 'true'
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # Secrets come in as environment variables, never spliced into the
      # script text: a password containing $(…) or a backtick can't run as
      # a command, and nothing secret ends up in the rendered script.
      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
      - if: env.HAS_KEYSTORE == 'true'
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --build-number=${{ github.run_number }}
      - name: Publish GitHub Release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Deploy web to GitHub Pages
    # Opt-in until web hosting is set up: Settings → Pages → Source "GitHub
    # Actions", then Settings → Variables → DEPLOY_PAGES = true.
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish to GitHub Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
